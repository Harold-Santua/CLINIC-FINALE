<app-healthcare-shell>
  <section class="auth-card">
    <img src="HOSPITAL.png" alt="Hospital Logo" width="64" height="64" />
    <h1>Set New Password</h1>
    <p class="tagline" *ngIf="codeValid && emailHint">Resetting password for <strong>{{ emailHint }}</strong></p>
    <p class="tagline" *ngIf="!codeValid && !completed">{{ codeError }}</p>

    <form *ngIf="codeValid && !completed" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" formControlName="password" autocomplete="new-password" />
        <small *ngIf="form.controls['password'].touched && form.controls['password'].errors?.['required']">
          Password is required.
        </small>
        <small *ngIf="form.controls['password'].touched && form.controls['password'].errors?.['minlength']">
          Use at least 6 characters.
        </small>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <small *ngIf="form.touched && form.errors?.['mismatch']">Passwords do not match.</small>
      </div>
      <button type="submit" class="submit-btn" [disabled]="submitting">
        {{ submitting ? 'Saving…' : 'Update password' }}
      </button>
    </form>

    <p class="success-msg" *ngIf="completed">Password updated successfully. Redirecting to login…</p>

    <div class="links">
      <a routerLink="/forgot-password">Request new link</a>
      <span> · </span>
      <a routerLink="/login">Back to Login</a>
    </div>
  </section>
</app-healthcare-shell>
